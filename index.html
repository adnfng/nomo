<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nomo</title>
    <meta
      name="description"
      content="The open-source profile page that starts with a human.md."
    />
    <meta name="theme-color" content="#ffffff" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        if (localStorage.getItem("nomo-theme") === "dark") {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.colorScheme = "dark";
        }
      } catch (e) {}
    </script>
    <link rel="preload" href="/font/nomo.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" href="/nomo.svg" type="image/svg+xml" />
    <link rel="shortcut icon" href="/nomo.svg" />
    <link rel="apple-touch-icon" href="/nomo.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Nomo" />
    <meta property="og:url" content="https://nomo.md" />
    <meta property="og:title" content="Nomo" />
    <meta
      property="og:description"
      content="The open-source profile page that starts with a human.md."
    />
    <meta property="og:image" content="https://nomo.md/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nomo social preview" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Nomo" />
    <meta
      name="twitter:description"
      content="The open-source profile page that starts with a human.md."
    />
    <meta name="twitter:image" content="https://nomo.md/og.png" />
    <meta name="twitter:image:alt" content="Nomo social preview" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
